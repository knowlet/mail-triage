name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python 3.12 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_PYTHON_DOWNLOADS: never
      DSPY_CACHEDIR: ${{ github.workspace }}/.pytest_cache/dspy
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      HF_HUB_OFFLINE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned uv from PyPI
        run: >-
          python -m pip --isolated install
          --disable-pip-version-check --no-cache-dir --only-binary=:all:
          --index-url https://pypi.org/simple uv==0.12.23

      - name: Install locked dependencies including model stubs
        run: uv sync --locked --extra models --index-url https://pypi.org/simple

      - name: Run lint, format, types and offline tests
        env:
          UV_OFFLINE: "1"
        run: make check
